apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: blog-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: blog-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
      - name: external-dns
        image: registry.k8s.io/external-dns/external-dns:v0.14.0
        args:
        - --source=ingress
        - --provider=azure
        - --azure-resource-group=my-dns-rg    # CHANGE to your DNS zone RG
        - --domain-filter=example.com         # CHANGE to your DNS zone
        - --policy=upsert-only
        - --registry=txt
        - --txt-owner-id=aks-external-dns
        - --azure-use-managed-identity=true
