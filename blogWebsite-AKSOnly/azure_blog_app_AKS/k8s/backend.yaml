apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: blog-app
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
      - name: api
        image: <ACR_LOGIN>/backend:latest
        ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: blog-app
spec:
  type: ClusterIP
  selector: { app: backend }
  ports: [{ port: 8080, targetPort: 8080 }]
